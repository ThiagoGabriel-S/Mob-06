<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Estoque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }

        .container {
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }
        
        .mensagem {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
        }

        .ok {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .no {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>🎮 Controles DualSelse</h2>
        <p>Quantidade disponível em estoque: <strong>3 unidades</strong></p>

        <label for="quantidade">Quantidade desejada:</label>
        <input type="number" id="quantidade" min="1" placeholder="Digite a quantidade">

        <button onclick="verificarEstoque()">Verificar Disponibilidade</button>

        
        <div id="mensagem" class="mensagem" style="display: none;"></div>
    </div>

    <script>
        function verificarEstoque() {
            
            const estoqueDisponivel = 3;
            const quantidadeSolicitada = parseInt(document.getElementById('quantidade').value);
            const elementoMensagem = document.getElementById('mensagem');

            if (isNaN(quantidadeSolicitada) || quantidadeSolicitada <= 0) {
                elementoMensagem.style.display = 'block';
                elementoMensagem.className = 'mensagem no';
                elementoMensagem.innerHTML = '❌ Por favor, insira uma quantidade válida maior que zero.';
                return;
            }

            elementoMensagem.style.display = 'block';
           
            if (quantidadeSolicitada <= estoqueDisponivel) {
                
                elementoMensagem.className = 'mensagem ok';
                elementoMensagem.innerHTML = '✅ Sucesso! A quantidade solicitada está disponível em estoque.';
            } else {
               
                elementoMensagem.className = 'mensagem no';
                elementoMensagem.innerHTML = '❌ Estoque ultrapassado! Não temos essa quantidade disponível.';
            }
        }
    </script>
</body>
</html>
