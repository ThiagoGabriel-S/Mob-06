<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Campo de Texto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }        
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        .btn-testar {
            background-color: #0b07f3;
            color: white;
        }

        .btn-testar:hover {
            background-color: #3429c9;
        }

        .btn-limpar {
            background-color: #dc3545;
            color: white;
        }

        .btn-limpar:hover {
            background-color: #c82333;
        }

        #saida {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #0056b3;
            min-height: 24px;
            
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Digite seu Nome</h2>

        <input type="text" id="nome" placeholder="Digite algo aqui">
        <div>
            <button class="btn-testar" onclick="mensagem()">Testar</button>
            <button class="btn-limpar" onclick="limpar()">Limpar</button>
        </div>

        <p id="saida"></p>
    </div>

    <script>
        function mensagem() {
            var texto = document.getElementById("nome").value;
            document.getElementById("saida").innerText = texto;
        }
        function limpar() {
            document.getElementById("nome").value = "";
            mensagem();
        }
    </script>

</body>
</html>
